name: "Needle 3 / Laya Conversation"
version: "0.12.0"
slug: "needle_agent"
description: "Conversation-Agent (Wyoming) mit wählbarer Entscheidungsschicht: Needle 3 (Tool-Calling) oder Laya (System-1-Entscheidungen) – inkl. Fuzzy-/Phonetik-Namensauflösung, STT-Autokorrektur (auch falsch getrennte Komposita), Fast-Path und HA-Fallback"
url: "https://github.com/simon-krey/home-assistant-addons"
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
discovery:
  - wyoming
ingress: true
ingress_port: 8000
panel_icon: mdi:robot
panel_title: "Needle 3 / Laya"
ports:
  "10300/tcp": null
homeassistant_api: true
backup_exclude:
  - "models*"
  - "history*"
  - ".cache*"
options:
  backend: "needle"
  laya_model: "multilingual"
  laya_confidence_threshold: 0.6
  laya_max_candidates: 8
  laya_preload: true
  dry_run: true
  fast_path: true
  fallback_ha: true
  ground_calls: true
  debug_errors: true
  domains: "light,switch,media_player"
  tools: "turn_on_light,turn_off_light,turn_on_switch,turn_off_switch,get_entity_state"
  max_steps: 4
  language: "de"
  system: ""
  refresh_seconds: 300
  resolve_min_score: 0.72
  resolve_min_margin: 0.12
  resolve_floor: 0.55
  tool_match_min_score: 0.6
  low_confidence_threshold: 0.1
  needle_max_tokens: 256
  history_limit: 200
  correction_enabled: true
  correction_spans: true
  correction_min_score: 0.8
  correction_min_margin: 0.05
  correction_max_length_diff: 3
  log_capture: true
  debug_logging: false
schema:
  backend: "list(needle|laya)"
  laya_model: "list(multilingual|english)"
  laya_confidence_threshold: "float(0,1)"
  laya_max_candidates: "int(1,20)"
  laya_preload: "bool"
  dry_run: "bool"
  fast_path: "bool"
  fallback_ha: "bool"
  ground_calls: "bool"
  debug_errors: "bool"
  domains: "str"
  tools: "str?"
  max_steps: "int(1,8)"
  language: "str"
  system: "str?"
  refresh_seconds: "int(30,3600)"
  resolve_min_score: "float(0,1)"
  resolve_min_margin: "float(0,1)"
  resolve_floor: "float(0,1)"
  tool_match_min_score: "float(0,1)"
  low_confidence_threshold: "float(0,1)"
  needle_max_tokens: "int(32,1024)"
  history_limit: "int(0,1000)"
  correction_enabled: "bool"
  correction_spans: "bool"
  correction_min_score: "float(0,1)"
  correction_min_margin: "float(0,1)"
  correction_max_length_diff: "int(0,10)"
  log_capture: "bool"
  debug_logging: "bool"
