name: "Needle 3 Conversation"
version: "0.2.0"
slug: "needle_agent"
description: "Conversation-Agent (Wyoming) mit wählbarem Backend: Needle 3, OpenAI-kompatible LLMs (Ollama/llama.cpp) oder Home Assistants Agent – nativ in den Assist-Einstellungen auswählbar"
url: "https://github.com/DEIN-USER/voice-assistant"
arch:
  - aarch64
  - armv7
  - amd64
init: false
startup: application
boot: auto
discovery:
  - wyoming
ingress: true
ingress_port: 8000
panel_icon: mdi:robot
panel_title: "Needle 3"
ports:
  "10300/tcp": null
homeassistant_api: true
backup_exclude:
  - "models*"
  - "history*"
options:
  backend: "needle"
  dry_run: true
  domains: "light,switch,media_player"
  tools: "turn_on_light,turn_off_light,turn_on_switch,turn_off_switch,get_entity_state"
  max_steps: 4
  language: "de"
  system: ""
  refresh_seconds: 300
  fallback_ha: true
  ground_calls: true
  openai_base_url: "http://localhost:11434/v1"
  openai_api_key: ""
  openai_model: "qwen3:1.7b"
  openai_temperature: 0.2
  openai_max_tokens: 256
  llama_model: "qwen2.5-1.5b"
  llama_n_ctx: 4096
  llama_threads: 0
  llama_gpu_layers: 0
  llama_temperature: 0.2
  llama_max_tokens: 256
  llama_disable_thinking: true
  debug_logging: false
schema:
  backend: "list(needle|openai|ha)"
  dry_run: "bool"
  domains: "str"
  tools: "str?"
  max_steps: "int(1,8)"
  language: "str"
  system: "str?"
  refresh_seconds: "int(30,3600)"
  fallback_ha: "bool"
  ground_calls: "bool"
  openai_base_url: "str?"
  openai_api_key: "password?"
  openai_model: "str?"
  openai_temperature: "float(0,2)"
  openai_max_tokens: "int(32,4096)"
  llama_model: "str?"
  llama_n_ctx: "int(512,32768)"
  llama_threads: "int(0,32)"
  llama_gpu_layers: "int(0,200)"
  llama_temperature: "float(0,2)"
  llama_max_tokens: "int(32,4096)"
  llama_disable_thinking: "bool"
  debug_logging: "bool"
