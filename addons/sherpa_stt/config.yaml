name: "Sherpa STT (Wyoming)"
version: "0.5.0"
slug: "sherpa_stt"
description: "Lokales STT als Wyoming-Server – Kroko (Streaming) und NVIDIA Parakeet v3 (Offline, mit Contextual Biasing auf Entity-Namen), konservative Audio-Vorverarbeitung für schlechte Aufnahmen, nativ in den Assist-Einstellungen auswählbar, mit Verlauf inkl. Audio-Samples"
url: "https://github.com/simon-krey/home-assistant-addons"
arch:
  - aarch64
  - armv7
  - amd64
init: false
startup: application
boot: auto
discovery:
  - wyoming
ingress: true
ingress_port: 8000
panel_icon: mdi:account-voice
panel_title: "Sherpa STT"
ports:
  "10300/tcp": null
homeassistant_api: true
backup_exclude:
  - "models*"
  - "history*"
  - ".cache*"
options:
  model: "de"
  model_url: ""
  model_type: ""
  kind: ""
  language: ""
  num_threads: 2
  streaming_transcripts: false
  save_audio: true
  history_limit: 100
  zeroconf: ""
  debug_logging: false
  audio_preprocessing: "normalize"
  hotwords: ""
  hotwords_score: 2.5
  hotwords_from_ha: true
  hotwords_domains: "light,switch,media_player,scene,climate,fan,input_boolean"
  ha_url: ""
  ha_token: ""
schema:
  model: "list(de|en-kroko|es-kroko|fr-kroko|parakeet-v3|custom)"
  model_url: "str?"
  model_type: "str?"
  kind: "str?"
  language: "str?"
  num_threads: "int(1,8)"
  streaming_transcripts: "bool"
  save_audio: "bool"
  history_limit: "int(0,1000)"
  zeroconf: "str?"
  debug_logging: "bool"
  audio_preprocessing: "list(off|light|normalize|full)"
  hotwords: "str?"
  hotwords_score: "float(0.5,10)"
  hotwords_from_ha: "bool"
  hotwords_domains: "str?"
  ha_url: "str?"
  ha_token: "str?"
