[project]
name = "voice-assistant"
version = "0.1.0"
description = "Local voice assistant: streaming STT -> Needle 3 tool calling -> Home Assistant"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "sounddevice",
    "sherpa-onnx",
    "cactus-needle",
    "websockets>=13",
    "python-dotenv",
    "fastapi",
    "uvicorn[standard]",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["config", "main", "pipeline"]

[tool.setuptools.packages.find]
include = ["audio*", "stt*", "llm*", "tools*", "homeassistant*", "webui*"]
